---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.21.0
    app.quarkus.io/vcs-uri: https://github.com/NTB3S/quarkus-K8s-api.git
  labels:
    app.kubernetes.io/name: rest-json-quickstart
    app.kubernetes.io/managed-by: quarkus
  name: rest-json-quickstart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-json-quickstart
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.21.0
        app.quarkus.io/vcs-uri: https://github.com/NTB3S/quarkus-K8s-api.git
      labels:
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/name: rest-json-quickstart
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: {{ .Values.app.image }}
          imagePullPolicy: Always
          name: rest-json-quickstart
          ports:
            - containerPort: {{ .Values.app.ports.http }}
              name: http
              protocol: TCP
